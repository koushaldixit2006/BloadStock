services:
  mongo:
    image: mongo:7.0
    container_name: bloodstock-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: >
        mongosh --port 27017 --quiet --eval '
          try {
            var s = rs.status();
            if (s.myState === 1) quit(0);
          } catch (e) {
            try {
              rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
            } catch (err) {}
          }
          quit(1);
        '
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 3s
    networks:
      - bloodstock-net

  optimizer:
    build:
      context: ./optimizer
      dockerfile: Dockerfile
    container_name: bloodstock-optimizer
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SHARED_RULES_PATH=/shared/rules.json
      - INTERNAL_SECRET=bloodstock-dev-secret-key-32chars-min
    volumes:
      - ./shared:/shared:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - bloodstock-net

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: bloodstock-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongo:27017/bloodstock?replicaSet=rs0
      - OPTIMIZER_URL=http://optimizer:8000
      - INTERNAL_SECRET=bloodstock-dev-secret-key-32chars-min
      - JWT_SECRET=super-secret-jwt-key-for-bloodstock-planning-token-32c
      - SHARED_RULES_PATH=/shared/rules.json
    volumes:
      - ./shared:/shared:ro
    depends_on:
      mongo:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:3001/health\", (r) => process.exit(r.statusCode === 200 ? 0 : 1))' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - bloodstock-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: bloodstock-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bloodstock-net

volumes:
  mongo_data:

networks:
  bloodstock-net:
    driver: bridge

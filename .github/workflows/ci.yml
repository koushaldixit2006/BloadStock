name: BloodStock CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  optimizer-tests:
    name: Optimizer Test Suite (Python 3.11 + OR-Tools)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Optimizer Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r optimizer/requirements.txt

      - name: Run Optimizer Pytest Tests
        working-directory: ./optimizer
        run: |
          python -m pytest -v

  api-tests:
    name: API Test Suite (Node 20 + Express + Strict TS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: api/package-lock.json

      - name: Set up Single-Node MongoDB Replica Set
        uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: "7.0"
          mongodb-replica-set: "rs0"

      - name: Install API Dependencies
        working-directory: ./api
        run: npm ci

      - name: Run API Tests (Jest)
        working-directory: ./api
        env:
          MONGODB_URI: "mongodb://127.0.0.1:27017/bloodstock_test?replicaSet=rs0"
          PORT: 3001
          JWT_SECRET: "test-jwt-secret-minimum-32-characters-for-testing"
          JWT_REFRESH_SECRET: "test-refresh-secret-minimum-32-characters"
          INTERNAL_SECRET: "bloodstock-dev-secret-key-32chars-min"
          OPTIMIZER_URL: "http://127.0.0.1:8000"
          SHARED_RULES_PATH: "../shared/rules.json"
        run: npm test

  frontend-build:
    name: Frontend Typecheck & Build (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend Application
        run: npm run build
